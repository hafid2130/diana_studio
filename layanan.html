<!DOCTYPE html>
<html lang="id" data-bs-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daftar Layanan - Diana Beauty Studio</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>
    
    <style>
        .card-service {
            border-radius: 1rem;
            overflow: hidden;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }
        .card-service:hover {
            transform: translateY(-6px);
            box-shadow: 0 12px 24px rgba(0,0,0,0.15);
        }
        .card-service-img-wrapper {
            position: relative;
            height: 200px;
            overflow: hidden;
            background-color: #f1f3f5;
        }
        .card-service-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.4s ease;
        }
        .card-service:hover .card-service-img {
            transform: scale(1.08);
        }
        .badge-category {
            position: absolute;
            top: 12px;
            left: 12px;
            background-color: rgba(230, 57, 70, 0.9);
            color: #fff;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 600;
            z-index: 2;
        }
    </style>
</head>
<body class="bg-body-tertiary">

    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg sticky-top shadow-sm py-3 bg-body">
        <div class="container">
            <a class="navbar-brand d-flex align-items-center gap-2 fw-bold text-body" href="index.html">
                <img src="image1.jpeg" alt="Diana Logo" style="width: 42px; height: 42px; border-radius: 50%;" class="border">
                <span>DIANA <small class="text-danger fw-normal">Studio</small></span>
            </a>
            <div class="d-flex align-items-center gap-2 order-lg-3">
                <button class="btn btn-outline-secondary rounded-circle" id="themeToggle">
                    <i class="fa-solid fa-moon" id="themeIcon"></i>
                </button>
            </div>
            <div class="collapse navbar-collapse justify-content-end order-lg-2" id="navbarNav">
                <ul class="navbar-nav gap-3 me-3">
                    <li class="nav-item"><a class="nav-link fw-medium" href="index.html">Beranda</a></li>
                    <li class="nav-item"><a class="nav-link fw-medium text-danger active" href="layanan.html">Daftar Layanan</a></li>
                    <li class="nav-item"><a class="nav-link fw-medium" href="tentang-kami.html">Tentang Kami</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <header class="bg-dark text-white py-5 text-center animate__animated animate__fadeIn">
        <div class="container">
            <h1 class="fw-bold display-5">Menu & Layanan Perawatan</h1>
            <p class="text-white-50 mb-0">Perawatan profesional yang dapat dipesan langsung ke rumah Anda.</p>
        </div>
    </header>

    <section class="py-5">
        <div class="container">
            <div class="row g-4" id="service-container">
                <div class="text-center py-5">
                    <div class="spinner-border text-danger" role="status"></div>
                    <p class="mt-2 text-muted">Memuat data layanan dinamis...</p>
                </div>
            </div>
        </div>
    </section>

    <script>
        // API URL (Ganti dengan URL API Render Anda saat dipublish)
        const API_URL = 'https://diana-beauty-backend.onrender.com/api/services';

        // Sample Data Fallback (Jika API belum terhubung)
        const fallbackServices = [
            { id: 1, name: "Potong & Styling Rambut", category: "Hair Care", image: "image2.jpeg", description: "Layanan pemotongan dan penataan gaya rambut presisi." },
            { id: 2, name: "Facial & Massage Wajah", category: "Skin & Spa", image: "image3.jpeg", description: "Pembersihan mendalam dan relaksasi otot wajah." },
            { id: 3, name: "Hair Treatment L'Oréal", category: "Hair Treatment", image: "image4.jpeg", description: "Perawatan rambut intensif dengan produk terkemuka." }
        ];

        async function renderServices() {
            const container = document.getElementById('service-container');
            let services = [];

            try {
                const res = await fetch(API_URL);
                if (res.ok) {
                    services = await res.json();
                } else {
                    services = fallbackServices;
                }
            } catch (err) {
                services = fallbackServices;
            }

            container.innerHTML = '';
            services.forEach((item, index) => {
                container.innerHTML += `
                    <div class="col-md-6 col-lg-4 animate__animated animate__fadeInUp" style="animation-delay: ${index * 0.15}s;">
                        <div class="card card-service h-100 bg-body border-0 shadow-sm">
                            <div class="card-service-img-wrapper">
                                <span class="badge-category">${item.category}</span>
                                <img src="${item.image}" class="card-service-img" alt="${item.name}">
                            </div>
                            <div class="card-body d-flex flex-column p-4">
                                <h4 class="fw-bold h5 mb-2">${item.name}</h4>
                                <p class="text-muted small flex-grow-1">${item.description}</p>
                                <a href="https://wa.me/6285894950648?text=Halo%20Diana%20Beauty%20Studio,%20saya%20ingin%20pesan%20layanan%20${encodeURIComponent(item.name)}" 
                                   target="_blank" class="btn btn-danger w-100 rounded-pill py-2 mt-3">
                                   <i class="fa-brands fa-whatsapp me-2"></i> Pesan via WhatsApp
                                </a>
                            </div>
                        </div>
                    </div>
                `;
            });
        }

        renderServices();

        // Dark Mode Logic
        const themeToggleBtn = document.getElementById('themeToggle');
        const themeIcon = document.getElementById('themeIcon');
        function setTheme(theme) {
            document.documentElement.setAttribute('data-bs-theme', theme);
            localStorage.setItem('theme', theme);
            themeIcon.className = theme === 'dark' ? 'fa-solid fa-sun text-warning' : 'fa-solid fa-moon';
        }
        setTheme(localStorage.getItem('theme') || 'light');
        themeToggleBtn.addEventListener('click', () => {
            setTheme(document.documentElement.getAttribute('data-bs-theme') === 'dark' ? 'light' : 'dark');
        });
    </script>
</body>
</html>
